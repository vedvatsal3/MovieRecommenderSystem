services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: vved
      MONGO_INITDB_ROOT_PASSWORD: vatsall27
    volumes:
      - mongo-data:/data/db         

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: vved
      ME_CONFIG_MONGODB_ADMINPASSWORD: vatsall27
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo

  streamlit:
    image: vved/movie-recommender:latest
    ports:
      - "8501:8501"
    environment:
      MONGO_URI: "mongodb://vved:vatsall27@mongo:27017/?authSource=admin"
    depends_on:
      - mongo

volumes:                             
  mongo-data: